name: Multi-protein experimental Atlas benchmark

# Validate a new non-draft PR, or when a draft is marked ready.
# Ordinary pushes and PR updates do not trigger these jobs.
on:
  pull_request:
    types: [opened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  multiprotein-case-study:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Live multi-fold experimental comparisons (including citrate synthase)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Check R and Node code before network access
        run: |
          node --check scripts/atlas-multiprotein-fetch.cjs
          Rscript -e 'parse(file="scripts/atlas-multiprotein-benchmark.R")'
      - name: Install JSON reader
        run: Rscript -e 'install.packages("jsonlite")'
      - name: Fetch curated experimental PDBe structures across distinct folds
        run: node scripts/atlas-multiprotein-fetch.cjs benchmarks/output/atlas-multiprotein
      - name: Evaluate canonical overlap, torsion and controls
        run: Rscript scripts/atlas-multiprotein-benchmark.R benchmarks/output/atlas-multiprotein
      - name: Save benchmark provenance and per-position readouts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-multiprotein-experimental-benchmark
          path: benchmarks/output/atlas-multiprotein
          if-no-files-found: warn
          retention-days: 30
