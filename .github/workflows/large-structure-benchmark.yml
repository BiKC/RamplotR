name: Large-structure scaling benchmark

on:
  pull_request:
    paths:
      - "benchmarks/scale.R"
      - ".github/workflows/large-structure-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scaling:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install structure reader
        run: Rscript -e 'install.packages("bio3d")'
      - name: Fetch one real viral complex and preserve the parsed structure
        shell: bash
        run: |
          mkdir -p benchmarks/output/scaling
          Rscript -e 'source("shinyRam/R/io.R"); saveRDS(ram_load_structure(pdb_id = "6VXX"), "benchmarks/output/scaling/source-6vxx.rds")'
          sha256sum benchmarks/output/scaling/source-6vxx.rds > benchmarks/output/scaling/structure.sha256
      - name: Benchmark each multiplier in a fresh R process
        shell: bash
        run: |
          set -euo pipefail
          for factor in 1 3 10; do
            /usr/bin/time \
              -f 'peak_rss_kb=%M\nwall_seconds=%e' \
              -o "benchmarks/output/scaling/scaling-${factor}.metrics.txt" \
              Rscript benchmarks/scale.R \
                benchmarks/output/scaling/source-6vxx.rds \
                "$factor" 3 original \
                "benchmarks/output/scaling/scaling-${factor}.csv"
            cat "benchmarks/output/scaling/scaling-${factor}.metrics.txt"
          done
          {
            echo '## Structural scaling benchmark'
            echo 'Runs use the same parsed 6VXX structure replicated with unique chain IDs.'
            echo 'Each multiplier is executed in a separate R process on this runner.'
            echo
            for factor in 1 3 10; do
              echo "### ${factor}x copies"
              cat "benchmarks/output/scaling/scaling-${factor}.metrics.txt"
              echo
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Archive numerical measurements, memory data and software versions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ramplotr-large-structure-scaling
          path: benchmarks/output/scaling/
          if-no-files-found: warn
          retention-days: 30
