name: Structure validation and benchmark

# Validate a new non-draft PR, or when a draft is marked ready.
# Ordinary pushes and PR updates do not trigger these jobs.
on:
  pull_request:
    types: [opened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structure:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install Bio3D
        run: Rscript -e 'install.packages("bio3d")'
      - name: Compare torsions against Bio3D
        run: Rscript benchmarks/validate_vs_bio3d.R 1CRN benchmarks/output/validation-1crn.csv
      - name: Benchmark the same structure
        run: Rscript benchmarks/run.R 1CRN 3 original benchmarks/output/benchmark-1crn.csv
      - name: Validate multi-chain viral protein
        run: Rscript benchmarks/validate_vs_bio3d.R 6VXX benchmarks/output/validation-6vxx.csv
      - name: Benchmark multi-chain viral protein
        run: Rscript benchmarks/run.R 6VXX 3 original benchmarks/output/benchmark-6vxx.csv
      - name: Archive numerical results and R session details
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ramplotr-validation-results
          path: benchmarks/output/
          if-no-files-found: warn
