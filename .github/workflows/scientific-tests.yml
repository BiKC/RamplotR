name: Scientific regression tests

on:
  push:
    branches: [main, "upgrade/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: R scientific tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Check source syntax
        run: Rscript -e 'for (p in c("shinyRam/app.R", "scripts/export-shinylive.R", list.files("shinyRam/R", full.names=TRUE))) parse(file=p)'
        shell: bash
      - name: Check scoped one.com deployment templates
        run: |
          test -s config/onecom/ramplotr.htaccess
          test -s config/onecom/shinylive.htaccess
          test -s config/onecom/reference-data.htaccess
          grep -q 'shinylive.htaccess' scripts/export-shinylive.R
          grep -q 'reference-data.htaccess' scripts/export-shinylive.R
        shell: bash
      - name: Check the responsive interface and preserved Shiny IDs
        run: Rscript tests/ui-contract.R
        shell: bash
      - name: Test browser message handler and source selection
        run: |
          node --check shinyRam/www/custom.js
          node --check shinyRam/www/canonical-mapping.js
          node --check shinyRam/www/experimental-search.js
          node --check shinyRam/www/compare.js
          node --check shinyRam/www/prediction.js
          node tests/compare-ui.test.cjs
          node --check shinyRam/www/density.js
          node --check shinyRam/www/plotly-loader.js
          node tests/plotly-loader.test.cjs
          node tests/density-ui.test.cjs
          node tests/canonical-mapping.test.cjs
          node tests/ui.test.cjs
          node tests/prediction-ui.test.cjs
        shell: bash
      - name: Install optional official wwPDB XML parser
        run: Rscript -e 'install.packages("xml2", repos="https://cloud.r-project.org")'
        shell: bash
      - name: Verify geometry, ensembles and offline CLI
        run: |
          Rscript tests/geometry.R
          Rscript tests/experimental.R
          Rscript tests/ensemble.R
          Rscript tests/group-comparison.R
          Rscript tests/batch.R
        shell: bash
      - name: Verify AlphaFold and ESMFold confidence formats
        run: Rscript tests/predictions.R
        shell: bash
      - name: Verify residue review, sequence, pairwise alignment and model selection
        run: Rscript tests/inspection.R
        shell: bash
      - name: Verify residue classifications, canonical coordinates and density thresholds
        run: |
          Rscript tests/scientific.R
          Rscript tests/rama8000.R
          Rscript tests/canonical.R
        shell: bash
      - name: Verify peptide continuity and torsion calculations
        run: Rscript tests/peptide.R
        shell: bash
      - name: Verify independent-reference identifier matching
        run: Rscript tests/validation-alignment.R
        shell: bash
      - name: Verify cached reference profiles
        run: Rscript tests/profile.R
        shell: bash
      - name: Verify local and thin-manifest reference access
        run: Rscript tests/reference-loader.R
        shell: bash
      - name: Verify structure input and reference-specific classifications
        run: |
          Rscript tests/input.R
          Rscript tests/classification.R
        shell: bash
